image:
  repository: localhost/ucl-arc-tre-egress
  tag: release

replicaCount: 1

service:
  type: NodePort
  nodePort: 30001
  port: 80

debug: true

storage:
  provider: generic
  generic:
    tls:
      issuerName: ca-issuer
      certManager:
        duration: 720h # 30 days
        renewBefore: 240h # 10 days

db:
  provider: rqlite
  rqlite:
    baseUrl: http://rqlite.rqlite.svc.cluster.local
    username: dbuser
    password: dbuser # pragma: allowlist secret

auth:
  mTLS:
    enabled: true
    issuerName: ca-issuer
    certManager:
      duration: 2h
      renewBefore: 1h
      additionalDNSNames: ['localhost']
  bearer:
    enabled: true
    issuer_url: 'http://auth-server.auth.svc.cluster.local:8900'
    audience: 'egress'
