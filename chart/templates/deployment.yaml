{{- $name := .Release.Name -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    "app.kubernetes.io/name": {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      "app.kubernetes.io/name": {{ $name }}
  template:
    metadata:
      labels:
        "app.kubernetes.io/name": {{ $name }}
      annotations:
        # Roll deployment when the config changes; used in e2e tests
        # https://helm.sh/docs/howto/charts_tips_and_tricks/#automatically-roll-deployments
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      # When create=true, use the created SA (defaulting its name to the release name).
      # When create=false but a name is set, reference that existing SA.
      # Otherwise when both lines are omitted the pod uses the namespace's default SA.
      serviceAccountName: {{ if .Values.serviceAccount.create }}{{ .Values.serviceAccount.name | default .Release.Name }}{{ else }}{{ .Values.serviceAccount.name }}{{ end }}
      automountServiceAccountToken: {{ gt (len .Values.serviceAccount.annotations) 0 }} # required if using IRSA
      {{- end }}
      containers:
        - name: "app"
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          securityContext:
            privileged: false
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
          env:
            - name: DEBUG
              value: "{{ .Values.debug }}"
            - name: HTTP_PORT
              value: "{{ template "http_container_port" . }}"
            {{- if .Values.auth.mTLS.enabled }}
            - name: HTTPS_PORT
              value: "{{ template "https_container_port" . }}"
            {{ end }}
          ports:
            - name: http
              containerPort: {{ template "http_container_port" . }}
              protocol: TCP
            {{- if .Values.auth.mTLS.enabled }}
            - name: https
              containerPort: {{ template "https_container_port" . }}
              protocol: TCP
            {{ end }}
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            {{- if and (hasKey .Values "dev") .Values.dev.hot_reload }}
            failureThreshold: 10
            {{- end }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/egress
              readOnly: true
          {{- if eq .Values.storage.provider "generic" }}
            - name: tls-storage-generic
              mountPath: {{ template "storage_generic_mtls_dir" . }}
              readOnly: true
          {{- end }}
          {{- if .Values.auth.mTLS.enabled }}
            - name: tls
              mountPath: {{ template "mtls_dir" . }}
              readOnly: true
          {{- end }}
          {{- if and (hasKey .Values "dev") .Values.dev.hot_reload }}
            - name: repo
              mountPath: /repo
              readOnly: false
            - name: tmp
              mountPath: /tmp
              readOnly: false
            - name: gopkg
              mountPath: /go/pkg
            - name: cache
              mountPath: /home/user/.cache
          {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ $name }}-config
      {{- if .Values.auth.mTLS.enabled }}
        - name: tls
          secret:
            secretName: {{ $name }}-tls-secret
      {{- end }}
      {{- if eq .Values.storage.provider "generic" }}
        - name: tls-storage-generic
          secret:
            secretName: {{ $name }}-storage-generic-tls-secret
      {{- end }}
      {{- if and (hasKey .Values "dev") .Values.dev.hot_reload }}
        - name: repo
          hostPath:
             path: "/repo"
             type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
        - name: gopkg
          emptyDir: {}
        - name: cache
          emptyDir: {}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
